name: 루머 앱 자동 빌드 (Android APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      server_url:
        description: '서버 전체 주소(로컬: http://192.168.x.x:4000/app/ 또는 실배포: https://xxx.onrender.com/app/)'
        required: true
        default: 'https://roomer-backend.onrender.com/app/'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 설치(+ Gradle 캐시 자동관리)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 패키지 설치
        run: npm install

      - name: 서버 주소 자동반영(입력값이 있으면 설정파일에 덮어씀)
        if: ${{ github.event.inputs.server_url != '' }}
        run: |
          sed -i "s|const SERVER_BASE_URL = '.*';|const SERVER_BASE_URL = '${{ github.event.inputs.server_url }}';|" capacitor.config.ts
          echo "적용된 서버 주소: ${{ github.event.inputs.server_url }}"
          grep SERVER_BASE_URL capacitor.config.ts

      - name: Capacitor 동기화(웹 자산 → 안드로이드 프로젝트)
        run: npx cap sync android

      - name: Gradle 실행권한 부여
        run: chmod +x android/gradlew

      - name: APK 빌드(디버그용 — 테스트 설치 가능)
        working-directory: android
        run: ./gradlew clean assembleDebug --stacktrace

      - name: 빌드된 APK 업로드(다운로드 가능하게)
        uses: actions/upload-artifact@v4
        with:
          name: 루머-ROOMER-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
