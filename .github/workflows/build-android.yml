name: 루머 앱 자동 빌드 (Android APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      server_ip:
        description: 'PC의 로컬 네트워크 IP(server.js 실행시 콘솔에 뜨는 그 IP, 예: 192.168.0.5)'
        required: true
        default: '192.168.0.2'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java(빌드 도구용) 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK 설치+라이선스 자동동의(흔한 빌드실패 원인 사전방지)
        uses: android-actions/setup-android@v3

      - name: Gradle 빌드 속도향상용 캐시
        uses: gradle/actions/setup-gradle@v4

      - name: 패키지 설치
        run: npm install

      - name: 서버 IP 자동반영(입력값이 있으면 설정파일에 덮어씀)
        if: ${{ github.event.inputs.server_ip != '' }}
        run: |
          sed -i "s|const DEV_SERVER_IP = '.*';|const DEV_SERVER_IP = '${{ github.event.inputs.server_ip }}';|" capacitor.config.ts
          echo "적용된 서버 IP: ${{ github.event.inputs.server_ip }}"
          grep DEV_SERVER_IP capacitor.config.ts

      - name: Capacitor 동기화(웹 자산 → 안드로이드 프로젝트)
        run: npx cap sync android

      - name: Gradle 실행권한 부여
        run: chmod +x android/gradlew

      - name: APK 빌드(디버그용 — 테스트 설치 가능, 실패시 상세로그 출력)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: 빌드된 APK 업로드(다운로드 가능하게)
        uses: actions/upload-artifact@v4
        with:
          name: 루머-ROOMER-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
